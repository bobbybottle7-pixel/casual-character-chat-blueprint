<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080a0d"><title>CamAI Local 1.2</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{color-scheme:dark;--bg:#080a0d;--panel:#10141a;--panel2:#151a21;--text:#edf1f7;--muted:#8e9aaa;--line:#242b35;--accent:#7dd3fc;--bad:#ff9b9b;--good:#9fe3b1}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}
header{position:sticky;top:0;background:#080a0df2;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:12px 14px;z-index:2}.bar{display:flex;gap:9px;align-items:center}.brand{font-weight:800;letter-spacing:.3px}.status{font-size:12px;color:var(--muted);margin-left:auto}.panel{max-width:900px;margin:10px auto;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
select{min-width:0;flex:1;background:var(--panel2);color:var(--text);border:1px solid var(--line);padding:9px;border-radius:10px}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;padding:10px 12px}.btn:disabled{opacity:.45}.danger{color:var(--bad)}.small{font-size:12px;color:var(--muted);line-height:1.45;margin-top:9px}
main{max-width:900px;margin:auto;padding:16px 12px 130px}.msg{max-width:90%;padding:12px 14px;border:1px solid var(--line);border-radius:16px;margin:10px 0;white-space:pre-wrap;line-height:1.48;overflow-wrap:anywhere}.user{margin-left:auto;background:#131b24}.assistant{background:var(--panel)}.msg.error{color:var(--bad)}.empty{color:var(--muted);text-align:center;padding:18vh 18px}.composer{position:fixed;bottom:0;left:0;right:0;background:#080a0df2;border-top:1px solid var(--line);padding:10px;padding-bottom:max(10px,env(safe-area-inset-bottom));backdrop-filter:blur(12px)}.row{max-width:900px;margin:auto;display:flex;gap:8px;align-items:flex-end}.row textarea{flex:1;resize:none;min-height:48px;max-height:160px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:12px;outline:none;font:inherit}.ok{color:var(--good)}.warn{color:#ffd38a}.err{color:var(--bad)}.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 7px;margin-right:5px}
</style>
</head>
<body>
<header>
 <div class="bar"><div class="brand">◈ CamAI Local</div><div id="status" class="status">CPU engine not loaded</div><button id="new" class="btn">New chat</button></div>
 <div class="panel">
  <div class="bar">
   <select id="model">
    <option value="onnx-community/Qwen2.5-0.5B-Instruct">Qwen 2.5 0.5B · smarter · ~510 MB</option>
    <option value="onnx-community/SmolLM2-360M-Instruct-ONNX">SmolLM2 360M · faster · ~365 MB</option>
   </select>
   <button id="load" class="btn">Load model</button><button id="free" class="btn danger" title="Delete downloaded model files from this browser">Free space</button>
  </div>
  <div id="progress" class="small">Runs on your phone's CPU (no WebGPU, no API key). The first load downloads the model once; after that it loads from the browser cache.</div>
 </div>
</header>
<main id="chat"></main>
<div class="composer"><div class="row"><textarea id="input" placeholder="Talk to CamAI…" rows="1"></textarea><button id="send" class="btn" disabled>Send</button></div></div>
<!-- The model runs in a background worker so the page (and the Stop button) stays responsive while it thinks. -->
<script type="text/plain" id="worker-src">
// Classic worker + dynamic import: Chrome refuses module workers when index.html is opened as a local file.
const lib=import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.0');lib.catch(()=>{});
let generator=null;
self.onmessage=async({data:msg})=>{
 if(msg.type==='load'){
  try{
   const {pipeline}=await lib;
   generator=await pipeline('text-generation',msg.model,{device:'wasm',dtype:'q8',progress_callback:p=>self.postMessage({type:'progress',p})});
   self.postMessage({type:'ready'});
  }catch(e){self.postMessage({type:'error',stage:'load',message:String(e?.message||e)})}
  return;
 }
 if(msg.type==='generate'){
  try{
   const {TextStreamer}=await lib;
   const streamer=new TextStreamer(generator.tokenizer,{skip_prompt:true,skip_special_tokens:true,callback_function:text=>self.postMessage({type:'token',text})});
   await generator(msg.messages,{max_new_tokens:384,do_sample:true,temperature:.7,top_p:.9,repetition_penalty:1.1,streamer});
   self.postMessage({type:'done'});
  }catch(e){self.postMessage({type:'error',stage:'generate',message:String(e?.message||e)})}
 }
};
</script>
<script type="module">
const CHAT_KEY='camai-local-v11', MODEL_KEY='camai-local-model';
const SYSTEM='You are CamAI, a direct, independent, privacy-first local AI assistant. Be useful and honest. Distinguish facts from uncertainty. Do not pretend to have tools, browsing, or knowledge you do not have. You are concise when appropriate and strong at coding and reasoning.';
// Small models on a phone CPU: re-reading a long chat on every turn is the main cause of slow replies.
const MAX_CONTEXT_MESSAGES=8, MAX_CONTEXT_CHARS=4000;
const CACHE_KEY='transformers-cache';

const $=id=>document.getElementById(id);
let worker=null, ready=false, loadedModel=null, loadingModel=null, loading=false, generating=false, ai=null;
let history=load(CHAT_KEY,[]);
if(!Array.isArray(history)) history=[];

function load(k,fallback){try{const v=localStorage.getItem(k);return v==null?fallback:JSON.parse(v)}catch{return fallback}}
function save(){try{localStorage.setItem(CHAT_KEY,JSON.stringify(history))}catch(e){console.warn('Could not save chat',e)}}
function setStatus(text,cls=''){$('status').textContent=text;$('status').className='status '+cls}

function bubble(m){const d=document.createElement('div');d.className='msg '+m.role+(m.error?' error':'');d.textContent=m.content;return d}
function render(){
 const c=$('chat');c.replaceChildren();
 if(!history.length){c.innerHTML='<div class="empty">'+(ready?'Model ready. Say hi.':'Tap <b>Load model</b> to start.')+'<br><br><span class="pill">No API key</span><span class="pill">No account</span><span class="pill">Local inference</span></div>';return}
 for(const m of history)c.appendChild(bubble(m));
 scrollDown();
}
function scrollDown(){window.scrollTo(0,document.body.scrollHeight)}

function syncButtons(){
 $('load').disabled=loading||generating;$('model').disabled=loading||generating;$('free').disabled=loading||generating;$('new').disabled=generating;
 $('send').disabled=!ready||loading;$('send').textContent=generating?'Stop':'Send';
}

const saved=load(MODEL_KEY,null);
if(saved&&[...$('model').options].some(o=>o.value===saved))$('model').value=saved;
render();syncButtons();

function progressText(p){
 if(!p)return '';
 if(p.status==='progress'&&typeof p.progress==='number')return `Downloading ${p.file||'model'} · ${Math.round(p.progress)}%`;
 if(p.status==='ready')return 'Preparing model…';
 return p.status?`${p.status}${p.file?' · '+p.file:''}`:'Loading…';
}

// Terminating the worker is the only way to fully release the model's memory, which matters on a 4 GB phone.
function stopWorker(){if(worker){worker.terminate();worker=null}ready=false;loadedModel=null}
function startWorker(){
 const url=URL.createObjectURL(new Blob([$('worker-src').textContent],{type:'text/javascript'}));
 const w=new Worker(url);
 w.onmessage=onWorkerMessage;
 w.onerror=e=>{e.preventDefault?.();onWorkerMessage({data:{type:'error',stage:loading?'load':'generate',message:e.message||'The model worker crashed (possibly out of memory).'}})};
 return w;
}

let pending=false, live=null;
function paint(){pending=false;if(live&&ai){live.textContent=ai.content;scrollDown()}}

function onWorkerMessage({data:msg}){
 if(msg.type==='progress'){$('progress').textContent=progressText(msg.p);return}
 if(msg.type==='ready'){
  // Ask the browser not to evict the cached model when the phone is low on space.
  navigator.storage?.persist?.().catch(()=>{});
  loading=false;ready=true;loadedModel=loadingModel;$('model').value=loadedModel;try{localStorage.setItem(MODEL_KEY,JSON.stringify(loadedModel))}catch{}
  setStatus('Local CPU ready','ok');$('progress').textContent='Ready. Everything runs on this device. Replies are slower than cloud AI because this uses the phone CPU.';
  if(!history.length)render();syncButtons();return;
 }
 if(msg.type==='token'&&ai){ai.content+=msg.text;if(!pending){pending=true;requestAnimationFrame(paint)}return}
 if(msg.type==='done'){finishReply();return}
 if(msg.type==='error'){
  console.error(msg.message);
  if(msg.stage==='load'||loading){
   loading=false;stopWorker();setStatus('Load failed','err');
   $('progress').textContent='Could not load the model: '+msg.message+'. Check your connection and free storage, then try again. If the tab keeps crashing, try the smaller SmolLM2 model.';
   syncButtons();
  }else if(ai){
   if(!worker||/crash|memory/i.test(msg.message)){stopWorker();setStatus('CPU engine not loaded')}
   ai.content=(ai.content?ai.content+'\n\n':'')+'Generation error: '+msg.message;ai.error=true;finishReply();
  }
 }
}

function loadModel(id,note){
 stopWorker();loading=true;loadingModel=id;syncButtons();setStatus(note?'Reloading model…':'Loading CPU engine…');
 $('progress').textContent=note||'Starting Transformers.js (CPU/WASM).';
 try{worker=startWorker();worker.postMessage({type:'load',model:id})}
 catch(e){onWorkerMessage({data:{type:'error',stage:'load',message:String(e?.message||e)}})}
}
$('load').onclick=()=>{
 if(loading||generating)return;
 const id=$('model').value;
 if(ready&&loadedModel===id){$('progress').textContent='This model is already loaded.';return}
 loadModel(id);
};

// Recent turns only, skipping failed replies so the model never sees its own error text.
function contextMessages(){
 const usable=history.filter(m=>!m.error&&m.content.trim());
 const out=[];let chars=0;
 for(let i=usable.length-1;i>=0&&out.length<MAX_CONTEXT_MESSAGES;i--){
  chars+=usable[i].content.length;
  if(out.length&&chars>MAX_CONTEXT_CHARS)break;
  out.unshift({role:usable[i].role,content:usable[i].content});
 }
 while(out.length&&out[0].role!=='user')out.shift();
 return [{role:'system',content:SYSTEM},...out];
}

$('send').onclick=()=>generating?stopReply():send();

// The CPU engine never pauses between words to read a "stop" message, so stopping
// means ending the worker and reloading the model from the browser cache (no re-download).
function stopReply(){
 if(!generating)return;
 const id=loadedModel;
 paint();if(ai)ai.content=ai.content.trimEnd()+(ai.content.trim()?' …[stopped]':'');
 if(ai&&!ai.content.trim()){history.pop();ai=null}
 stopWorker();finishReply();
 if(id)loadModel(id,'Stopped. Reloading the model from this browser (no new download)…');
}
$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();if(!generating)send()}});
$('input').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=e.target.scrollHeight+'px'});

function send(){
 if(!ready||generating||loading)return;
 const text=$('input').value.trim();if(!text)return;
 $('input').value='';$('input').style.height='';
 history.push({role:'user',content:text});
 const messages=contextMessages();
 ai={role:'assistant',content:''};history.push(ai);render();save();
 live=$('chat').lastElementChild;live.textContent='…';
 generating=true;syncButtons();setStatus('Thinking locally…','warn');
 worker.postMessage({type:'generate',messages});
}

function finishReply(){
 if(ai&&!ai.content.trim()){ai.content='[No reply. Try again or rephrase.]';ai.error=true}
 ai=null;live=null;generating=false;render();save();syncButtons();
 setStatus(ready?'Local CPU ready':'CPU engine not loaded',ready?'ok':'');
}

$('new').onclick=()=>{if(generating)return;if(history.length&&!confirm('Start a new chat? The current one will be deleted.'))return;history=[];save();render()};

$('free').onclick=async()=>{
 if(loading||generating)return;
 if(!confirm('Delete downloaded model files from this browser? You will need to download again (several hundred MB) next time. Your chat is kept.'))return;
 stopWorker();setStatus('CPU engine not loaded');
 try{
  const ok=typeof caches!=='undefined'&&await caches.delete(CACHE_KEY);
  $('progress').textContent=ok?'Model files deleted.':'Nothing to delete (no cached model files found).';
 }catch(e){$('progress').textContent='Could not delete cache: '+(e?.message||e)}
 finally{syncButtons();render()}
};
</script>
</body></html>
